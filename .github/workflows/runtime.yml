name: Runtime foundation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Runtime foundation / validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths and verify representative cases
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          classify_paths() {
            if (( $# == 0 )); then
              return 1
            fi

            local path
            for path in "$@"; do
              case "$path" in
                *.md) ;;
                *) return 1 ;;
              esac
            done
          }

          assert_runtime_required() {
            local expected="$1"
            shift
            local actual

            if classify_paths "$@"; then
              actual=false
            else
              actual=true
            fi

            if [[ "$actual" != "$expected" ]]; then
              printf 'FAIL: expected runtime_required=%s for paths: %s\n' "$expected" "$*" >&2
              exit 1
            fi

            printf 'PASS: runtime_required=%s for paths: %s\n' "$actual" "$*"
          }

          # Representative contract cases: only a complete Markdown-only set is lightweight.
          assert_runtime_required false README.md docs/ROADMAP.md
          assert_runtime_required true src/domain/example.ts
          assert_runtime_required true src/evaluation/example.test.ts
          assert_runtime_required true package.json package-lock.json .nvmrc
          assert_runtime_required true .github/workflows/runtime.yml
          assert_runtime_required true docs/ROADMAP.md src/engine/example.ts
          assert_runtime_required true assets/unknown-format.bin
          assert_runtime_required true

          mapfile -d '' changed_paths < <(git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA")
          if classify_paths "${changed_paths[@]}"; then
            printf 'runtime_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'Classified all changed paths as Markdown-only; runtime validation is not applicable to this diff.\n'
          else
            printf 'runtime_required=true\n' >> "$GITHUB_OUTPUT"
            printf 'At least one changed path is non-Markdown or the change set is empty; full runtime validation is required.\n'
          fi
      - name: Report runtime validation is not applicable to this diff
        if: steps.classify.outputs.runtime_required == 'false'
        run: echo "runtime validation not applicable to this diff"
      - uses: actions/setup-node@v4
        if: steps.classify.outputs.runtime_required == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the locked npm toolchain
        if: steps.classify.outputs.runtime_required == 'true'
        run: npm install --global npm@11.19.0
      - name: Install the locked dependency graph
        if: steps.classify.outputs.runtime_required == 'true'
        run: npm ci
      - name: Validate the runtime foundation
        if: steps.classify.outputs.runtime_required == 'true'
        run: npm run validate
